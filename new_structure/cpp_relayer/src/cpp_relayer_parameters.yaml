cpp_relayer:
  arm_id: {
    type: string,
    default_value: "panda",
  } 
  command_timeout_sec: {
    type: double,
    default_value: 0.2,
  }
  require_fresh_command_on_activate: {
    type: bool,
    default_value: true,
  }
  diagnostics_enabled: {
    type: bool,
    default_value: true,
  }
  diagnostics_log_period_sec: {
    type: double,
    default_value: 5.0,
  }
  log_first_n_stale_events: {
    type: int,
    default_value: 5,
  }
