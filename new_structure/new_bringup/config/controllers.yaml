controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    cpp_relayer:
      type: cpp_relayer/CPPRelayer

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda

cpp_relayer:
  ros__parameters:
    arm_id: panda
    command_timeout_sec: 0.2
    # 真机启动时 Python controller 可能尚未发布第一条 /effort_command。
    # false 允许 cpp_relayer 激活后使用 zero fallback 等待 fresh command，避免 activation deadlock。
    # command_timeout_sec=0.2 仍保留 stale command zeroing；这里不启用 GP/historical active compensation。
    require_fresh_command_on_activate: false
    # Diagnostics only: confirm whether Python /effort_command publish jitter triggers stale fallback.
    diagnostics_enabled: true
    diagnostics_log_period_sec: 5.0
    log_first_n_stale_events: 5
